<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17141F">
<meta name="color-scheme" content="dark">
<title>Flip Friend</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17141F;--card:#221E2C;--raise:#2B2637;--line:#352F42;--line2:#4A4258;--ink:#EDE8F5;--muted:#ABA3BC;--dim:#6E6680;
  --pink:#F27BA0;--pinkInk:#2A0F1C;--rose:#4A2238;--roseInk:#FFE9F0;--pink2:#FFB3CB;--bar:#B05578;
  --mint:#8FE3C8;--mintBg:#1E3A32;--mint2:#3FB894;--warm:#FFC98A;--warmBg:#43301A;--lav:#C4B8F5;--lavBg:#2E2847;
  --blue:#A9C8F2;--blueBg:#1E2D44;--orange:#F0A04B;--violet:#7B6BD6;--grey:#CFC7DD;--greyBg:#2E2938;--bad:#FF9FB8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 'Nunito',system-ui,sans-serif;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pink)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
header.top h1{margin:0;font-size:24px;font-weight:800;line-height:1.1}
header.top .sub{font-size:13px;font-weight:600;color:var(--muted)}
.grow{flex:1;min-width:0}
.sync{border:0;background:var(--raise);color:var(--muted);font-size:11px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap}
.sync.on{color:var(--mint)}.sync.bad{color:var(--warm)}
main{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.card h2,.h2{margin:0;font-size:14px;font-weight:800}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:12px;font-weight:600}.b{font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;min-width:0}
.tile .l{font-size:12px;font-weight:700;color:var(--muted)}
.tile .v{font-size:21px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;font-weight:600;color:var(--muted)}
.tile.sm{padding:7px 8px;border-radius:12px}.tile.sm .l{font-size:11px}.tile.sm .v{font-size:16px}
.hero{background:var(--rose);color:var(--roseInk);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.hero .big{font-size:38px;font-weight:800;line-height:1.1;color:#fff}
.meter{height:10px;border-radius:5px;background:#2E1624;overflow:hidden}.meter>i{display:block;height:100%;border-radius:5px;background:var(--pink)}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.track>i{display:block;height:100%;border-radius:4px;background:var(--mint2)}
.track>i.low{background:var(--orange)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap}
.c-warm{background:var(--warmBg);color:var(--warm)}.c-mint{background:var(--mintBg);color:var(--mint)}.c-lav{background:var(--lavBg);color:var(--lav)}
.c-blue{background:var(--blueBg);color:var(--blue)}.c-grey{background:var(--greyBg);color:var(--grey)}.c-pink{background:#3D1F2E;color:var(--pink2)}
.c-ink{background:var(--ink);color:var(--bg)}
.btn{height:48px;border-radius:24px;border:0;background:var(--pink);color:var(--pinkInk);font-size:15px;font-weight:800;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.full{width:100%}.btn.ghost{background:var(--raise);color:var(--ink);border:1px solid var(--line2)}
.btn.out{background:none;border:2px solid var(--pink);color:var(--pink)}
.btn.sm{height:36px;font-size:13px;padding:0 14px;border-radius:18px}
.btn.danger{background:none;border:1px solid #6B3346;color:var(--bad)}
.btn[disabled]{opacity:.5}
.link{border:0;background:none;color:var(--pink);font-weight:800;font-size:13px;padding:6px 0;min-height:32px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--raise);border-radius:22px;padding:4px}
.seg button{height:36px;border:0;border-radius:18px;background:none;color:var(--muted);font-size:13px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:800}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.pills::-webkit-scrollbar{display:none}
.pill{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:700;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:800}
.input,select.input,textarea.input{width:100%;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);padding:0 12px;font-size:15px;font-weight:700;outline:none}
textarea.input{height:auto;padding:10px 12px;font-weight:600;line-height:1.45;resize:vertical}
.input:focus{border-color:var(--pink)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
label.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:700}
label.check input{width:22px;height:22px;accent-color:var(--pink);flex-shrink:0}
.list{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%;color:inherit}
.thumb{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.lg{width:64px;height:64px;border-radius:14px}
.t-warm{background:#3A2A1A;color:var(--warm)}.t-lav{background:#2A2540;color:var(--lav)}.t-mint{background:#1C342D;color:var(--mint)}.t-grey{background:var(--greyBg);color:var(--grey)}.t-blue{background:#1A2638;color:var(--blue)}
.pmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pname{font-size:15px;font-weight:800;line-height:1.25}
.right{font-size:14px;font-weight:800;text-align:right;white-space:nowrap}
.pos{color:var(--mint)}.neg{color:var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#1D1927;border-top:1px solid var(--line);padding:4px 4px calc(10px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:6px 0 2px;min-height:54px}
nav.tabs button.on{color:var(--pink);font-weight:800}
nav.tabs svg{width:24px;height:24px}
.fab{position:fixed;right:max(18px,calc(50vw - 242px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:15;height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--pink);color:var(--pinkInk);font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.fab svg{width:20px;height:20px}
.fab2{bottom:calc(152px + env(safe-area-inset-bottom));background:var(--raise);color:var(--ink);border:1px solid var(--line2)}
.back{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;margin-left:-10px;flex-shrink:0}
.back svg{width:24px;height:24px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--raise);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn svg{width:22px;height:22px}
/* step timeline */
.steps{padding:10px 14px 4px}
.st{display:flex;gap:12px}
.st .rail{display:flex;flex-direction:column;align-items:center;width:28px;flex-shrink:0}
.st .dot{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.st .dot svg{width:16px;height:16px}
.st .dot.done{background:var(--mint2);color:#10241E}
.st .dot.cur{background:var(--pink);color:var(--pinkInk);box-shadow:0 0 0 4px var(--rose)}
.st .dot.todo{width:24px;height:24px;margin:2px;border:2px solid var(--line2);background:var(--card);color:var(--muted)}
.st .line{flex:1;width:2px;min-height:8px;background:var(--line)}
.st .line.done{background:#2F6E5C}
.st .body{flex:1;min-width:0;padding:3px 0 12px;display:flex;flex-direction:column;gap:7px}
.st .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%;border:0;background:none;padding:0;text-align:left}
.hchip{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line2);background:var(--raise);font-size:13px;font-weight:800;display:inline-flex;align-items:center;white-space:nowrap}
.entry{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--raise);border-radius:10px;padding:6px 6px 6px 10px;font-size:13px;font-weight:700;border:0;width:100%;text-align:left}
.entry svg{width:16px;height:16px;color:var(--muted)}
.timer{display:flex;align-items:center;justify-content:space-between;background:var(--rose);border-radius:12px;padding:9px 12px}
.timer .t{font-size:22px;font-weight:800;color:var(--roseInk);font-variant-numeric:tabular-nums}
.timer .s{font-size:12px;font-weight:700;color:var(--pink2)}
/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,6,12,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--card);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px}
.sheet .grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line2);flex-shrink:0}
.sheet h3{margin:0;font-size:20px;font-weight:800}
.x{width:44px;height:44px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;margin-right:-10px;flex-shrink:0}
.x svg{width:22px;height:22px}
.note{background:var(--raise);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--grey)}
.okbox{background:var(--mintBg);color:var(--mint);border-radius:14px;padding:12px 14px}
.warnbox{background:var(--warmBg);color:var(--warm);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--raise);font-size:20px;font-weight:800;flex-shrink:0}
.stepper input{width:64px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);font-weight:800;font-size:14px;padding:10px 16px;border-radius:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.busy{position:fixed;inset:0;z-index:70;background:rgba(8,6,12,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:800}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line2);border-top-color:var(--pink);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hist{display:grid;grid-template-columns:84px 1fr 24px;gap:7px;align-items:center;font-size:12px;font-weight:700}
.hist i{display:block;height:12px;border-radius:4px;background:var(--pink)}
.tbl{display:grid;row-gap:4px;font-size:13px;font-weight:700}
.tbl .r{text-align:right}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit}
.lrow:last-child{border-bottom:0}
.lrow svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.cgrp{padding:8px 0 2px;border-bottom:1px solid var(--line)}
.cgrp .lrow.sub{padding:6px 0 6px 14px;border-bottom:0;font-size:14px}
.catrow{display:flex;align-items:center;gap:6px}
.catrow .input{flex:1;min-width:0}
.catrow .ib{width:40px;height:44px;flex-shrink:0;border:1px solid var(--line);border-radius:12px;background:none;color:var(--ink);font-size:18px;font-weight:800;padding:0}
.catrow .ib[disabled]{opacity:.3}
.catrow .ib.del{color:var(--orange)}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:5px}
.gallery .ph{position:relative;height:150px;border-radius:14px;background:var(--raise);overflow:hidden;display:flex;align-items:center;justify-content:center;border:0;padding:0;width:100%}
.gallery .ph img{width:100%;height:100%;object-fit:cover}
.gallery .more{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:17px;border:0;background:rgba(23,20,31,.8);color:var(--ink);display:flex;align-items:center;justify-content:center}
.gallery figcaption{font-size:13px;font-weight:700}
.addtile{height:150px;border-radius:14px;border:2px dashed var(--line2);background:none;color:var(--muted);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#scanner{position:fixed;inset:0;z-index:50;background:#0E0C13;display:flex;flex-direction:column}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scanner .frame{position:absolute;left:50%;top:40%;width:260px;height:150px;transform:translate(-50%,-50%);border:3px solid var(--pink);border-radius:16px;box-shadow:0 0 0 2000px rgba(8,6,12,.55)}
#scanner .bar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
#scanner .bar button{width:44px;height:44px;border:0;background:rgba(23,20,31,.7);border-radius:22px;color:#fff;display:flex;align-items:center;justify-content:center}
#scanner .bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(8,6,12,.9) 30%);display:flex;flex-direction:column;gap:10px}
.empty{padding:20px 6px;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.connect{padding:30px 20px;display:flex;flex-direction:column;gap:14px}
/* ---------- desktop (1024px and wider; body.desk is set by the app) ---------- */
body.desk{font-size:15px}
body.desk button:not([disabled]){transition:transform .08s ease,filter .12s ease}
body.desk button:not([disabled]):hover{filter:brightness(1.12)}
body.desk button:not([disabled]):active{transform:scale(.97);filter:brightness(1.25)}
body.desk #app{max-width:none;margin:0 0 0 236px;padding-bottom:40px}
body.desk nav.tabs{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;background:#1C1826}
body.desk nav.tabs .in{max-width:none;margin:0;display:flex;flex-direction:column;gap:4px}
body.desk nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 14px;border-radius:14px;font-size:15px}
body.desk nav.tabs button:hover{background:var(--raise)}
body.desk nav.tabs button.on{background:var(--pink);color:var(--pinkInk)}
body.desk nav.tabs svg{width:20px;height:20px;flex-shrink:0}
body.desk nav.tabs button .grow{text-align:left}
body.desk header.top>.grow{flex:1 1 300px}
body.desk .btn{white-space:nowrap}
.dk-edit [data-ed="name"],.dk-edit [data-ed="notes"]{min-width:160px}
.dk-edit select[data-ed="status"]{min-width:124px}
.dk-edit input[type=date]{min-width:122px;padding:0 6px}
.dk-edit [data-ed].r{width:80px!important;min-width:70px}
body.desk .btn svg{width:18px;height:18px;flex-shrink:0}
.dk-table td.r{white-space:nowrap}
.dn-brand{display:flex;align-items:center;gap:12px;padding:0 6px 18px}
.dn-brand div{display:flex;flex-direction:column}.dn-brand b{font-size:18px}.dn-brand span{font-size:12px;font-weight:600;color:var(--muted)}
.dn-n{font-size:12px;font-weight:800}
.dn-timer{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dn-timer .t{font-size:22px;font-weight:800;color:var(--mint);font-variant-numeric:tabular-nums}
.dn-foot{font-size:12px;font-weight:700;color:var(--dim);padding:8px 6px 0}
body.desk header.top{padding:24px 28px 10px;flex-wrap:wrap}
body.desk header.top h1{font-size:28px}
body.desk header.top .sub{font-size:14px}
body.desk main{padding:6px 28px 28px;gap:16px}
body.desk .grid2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
body.desk .fab{right:28px;bottom:28px}
body.desk .fab2{bottom:92px}
body.desk .fab[data-act="receipt"],body.desk .fab[data-act="newExpense"]{display:none}
body.desk .toast{bottom:28px}
body.desk .pills{flex-wrap:wrap;overflow:visible}
.dk-solo main{max-width:1100px}
.dk-split{display:flex;align-items:flex-start;min-height:100vh}
.dk-main{flex:1;min-width:0}
.dk-side{width:400px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;background:#1C1826;border-left:1px solid var(--line)}
.dk-side header.top{padding-top:18px}
.dk-side main{padding:6px 20px 28px}
.dk-side .back{display:none}
.dk-wide{width:100%}
.dk-search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;background:var(--card);border:1px solid var(--line2);color:var(--muted);width:240px}
.dk-search input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:14px;font-weight:700;color:var(--ink)}
.dk-seg{width:150px}
.dk-table{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow-x:auto}
.dk-table table{width:100%;border-collapse:collapse;font-size:14px}
.dk-table th{text-align:left;font-size:12px;font-weight:800;color:var(--muted);padding:12px 10px;white-space:nowrap}
.dk-table td{padding:10px;border-top:1px solid var(--line);font-weight:700;vertical-align:middle}
.dk-table th:first-child,.dk-table td:first-child{padding-left:16px}.dk-table th:last-child,.dk-table td:last-child{padding-right:16px}
.dk-table .r{text-align:right}
.dk-table tr.click{cursor:pointer}
.dk-table tr.click:hover td{background:var(--raise)}
.dk-table tr.sel td{background:var(--lavBg)}
.dk-table tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--pink)}
.dk-cap{padding:14px 16px 4px;display:flex;flex-direction:column;gap:2px}
.dk-name{border:0;background:none;padding:0;font-weight:800;text-align:left;color:var(--ink)}
.dk-name:hover{color:var(--pink2)}
.dk-edit td{padding:5px 5px}
.dk-in{height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 9px;font-size:14px;font-weight:700;outline:none;width:100%;min-width:90px}
.dk-in:focus{border-color:var(--pink)}
.dk-in.r{text-align:right}
.dk-in.chg{border-color:var(--warm);background:var(--warmBg);color:var(--warm)}

<script>
/* =====================================================================
   Flip Friend — Refinished by Cecilia
   One-file phone app. The Google Sheet (business account) is the database;
   the Apps Script web app in Code.gs is the API.

const API_URL = "";

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eqi=(a,b)=>String(a==null?"":a).trim().toLowerCase()===String(b==null?"":b).trim().toLowerCase();
const LS={get(k,d){try{const v=localStorage.getItem("ff."+k);return v==null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem("ff."+k,v);}catch(e){}},del(k){try{localStorage.removeItem("ff."+k);}catch(e){}}};
const N=v=>v==null||v===""||isNaN(+v)?null:+v;
const r2=n=>Math.round((+n||0)*100)/100;
const r4=n=>Math.round((+n||0)*10000)/10000;
function money(n,d){if(n==null||isNaN(n))return"–";d=d==null?2:d;const s=Math.abs(n).toLocaleString("en-CA",{minimumFractionDigits:d,maximumFractionDigits:d});return(n<0?"−$":"$")+s;}
const money0=n=>money(n,0);
const pct=x=>x==null||isNaN(x)?"–":Math.round(x*100)+"%";
const hrs=h=>{h=r2(h);return(h%1===0?h.toFixed(0):String(h))+" h";};

const I={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',

  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',

  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  barcode:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13.5 8v8M17 8v8"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  dots:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>',
  warn:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  dresser:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="14" rx="2"/><path d="M4 9h16M4 13.5h16M10.5 6.5h3M10.5 11h3M10.5 15.5h3M6 18v2M18 18v2"/></svg>',
  photo:'<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>'
};
const LOGO='<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="12" fill="#FFD9E4"/><rect x="10" y="10" width="24" height="23" rx="4" fill="#fff" stroke="#2A2438" stroke-width="2"/><line x1="10" y1="22" x2="34" y2="22" stroke="#2A2438" stroke-width="2"/><circle cx="17.5" cy="15.5" r="1.5" fill="#2A2438"/><circle cx="26.5" cy="15.5" r="1.5" fill="#2A2438"/><path d="M20 17.5q2 1.8 4 0" stroke="#2A2438" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="14.5" cy="18.5" r="1.7" fill="#FF9DB5"/><circle cx="29.5" cy="18.5" r="1.7" fill="#FF9DB5"/><line x1="19" y1="27.5" x2="25" y2="27.5" stroke="#2A2438" stroke-width="2" stroke-linecap="round"/><line x1="14" y1="33" x2="14" y2="37" stroke="#2A2438" stroke-width="2" stroke-linecap="round"/><line x1="30" y1="33" x2="30" y2="37" stroke="#2A2438" stroke-width="2" stroke-linecap="round"/></svg>';

/* ---------- dates ('YYYY-MM-DD' strings everywhere) ---------- */
const pad=n=>String(n).padStart(2,"0");
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const today=()=>dayKey(Date.now());
const keyDate=k=>{const p=String(k).split("-").map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1,12);};
const fmtShort=k=>k?keyDate(k).toLocaleDateString("en-CA",{month:"short",day:"numeric"}):"";
const fmtLong=k=>k?keyDate(k).toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}):"";
const daysBetween=(a,b)=>Math.round((keyDate(b)-keyDate(a))/864e5);
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthKey=k=>String(k||"").slice(0,7);
const shiftMonth=(m,n)=>{const d=keyDate(m+"-01");d.setMonth(d.getMonth()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1);};
const monthName=m=>MONTHS[+m.slice(5,7)-1]+" "+m.slice(0,4);

/* =====================================================================
   SYNC — the Google Sheet is the source of truth.
   Changes show on screen right away, then go to the sheet in batches.
   ===================================================================== */
const COLLS=["projects","timelog","listings","supplyuse","supplies","barcodes","expenses","goals","inspiration","settings"];
let S={};COLLS.forEach(c=>S[c]=[]);
let ready=false,auth="ok",KEY=LS.get("key",""),API=API_URL||LS.get("api",""),sheetUrl=LS.get("sheet",""),lastSync=0;
let queue=[],inflight=false,flushT=null,retryT=null;
function readLinkParams(){
  try{
    const h=new URLSearchParams((location.hash||"").replace(/^#/,""));const q=new URLSearchParams(location.search);
    const api=h.get("api")||q.get("api"),key=h.get("key")||q.get("key");
    if(api&&/^https:\/\/script\.google\.com\//.test(api)){API=api;LS.set("api",api);}
    if(key){KEY=key.trim();LS.set("key",KEY);}
    if(api||key)history.replaceState(null,"",location.pathname);
  }catch(e){}
}
function callApi(payload){return fetch(API,{method:"POST",body:JSON.stringify(payload),redirect:"follow"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});}
/** One-off server work (pictures, receipts, barcodes). Doesn't wait for the save queue. */
async function call(fn,args){
  const res=await callApi({key:KEY,calls:[{fn,args}],noState:true});
  if(!res||!res.ok)throw new Error((res&&res.message)||"Couldn't reach your sheet.");
  return res.results[0];
}
const uid=()=>("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
function applyLocal(o){const arr=S[o.coll];if(o.op==="set"){const x=arr.find(d=>eqi(d.key,o.id));if(x)x.value=o.data.value;else arr.push({key:o.id,value:o.data.value});return;}if(o.op==="add"){const rec=Object.assign({id:o.id},o.data);const i=arr.findIndex(d=>d.id===o.id);if(i>=0)arr[i]=rec;else arr.push(rec);}else if(o.op==="update"){const x=arr.find(d=>d.id===o.id);if(x)Object.assign(x,o.data);}else S[o.coll]=arr.filter(d=>d.id!==o.id);}
function enqueue(o){queue.push(o);applyLocal(o);LS.set("queue",JSON.stringify(queue));onData();clearTimeout(flushT);flushT=setTimeout(flush,350);}
const store={
  add(c,data){const id=uid();enqueue({op:"add",coll:c,id,data});return id;},
  update(c,id,data){enqueue({op:"update",coll:c,id,data});},
  del(c,id){enqueue({op:"del",coll:c,id});}
};
function normalize(st){
  const out={};st=st||{};
  COLLS.forEach(c=>{out[c]=(st[c]||[]).map(r=>Object.assign({},r));});
  const nums={projects:["paid","list","sold","fee","profit"],timelog:["hours"],listings:["price","views","saves","inquiries"],supplyuse:["amount","cost"],supplies:["onHand","avgCost","inUse","lowAt"],expenses:["amount"],goals:["year","month","goal","min","max"]};
  Object.keys(nums).forEach(c=>out[c].forEach(r=>nums[c].forEach(k=>{r[k]=N(r[k]);})));
  out.projects.forEach(p=>{p.no=String(p.no==null?"":p.no).trim();p.status=normStatus(p.status);});
  ["timelog","listings","supplyuse","expenses","inspiration"].forEach(c=>out[c].forEach(r=>{r.project=String(r.project==null?"":r.project).trim();}));
  out.supplies.forEach(s=>{s.reusable=s.reusable===true||/^(true|yes|1)$/i.test(String(s.reusable));});
  return out;
}
function normStatus(s){s=String(s||"").trim().toLowerCase();if(/pending/.test(s))return"Pending";if(/^sold|^complete/.test(s))return"Sold";if(/^list|in stock/.test(s))return"Listed";if(/^dispos|^discard/.test(s))return"Disposed";if(/progress/.test(s))return"In progress";return"Not started";}
async function flush(){
  if(auth!=="ok"||!API||!KEY)return;
  if(inflight){clearTimeout(flushT);flushT=setTimeout(flush,400);return;}
  clearTimeout(retryT);
  const ops=queue.slice();inflight=true;setSync(ops.length?"saving":ready?"loading":"connecting");
  let res;
  try{res=await callApi({key:KEY,ops});}catch(e){res={ok:false,error:"network"};}
  inflight=false;
  if(res&&res.ok){
    queue=queue.slice(ops.length);LS.set("queue",JSON.stringify(queue));
    if(res.sheetUrl){sheetUrl=res.sheetUrl;LS.set("sheet",sheetUrl);}
    S=normalize(res.state);queue.forEach(applyLocal);
    try{LS.set("cache",JSON.stringify(S));}catch(e){}
    const first=!ready;ready=true;lastSync=Date.now();setSync("ok");
    if(first)render();else onData();
    if(queue.length){clearTimeout(flushT);flushT=setTimeout(flush,350);}
    return;
  }
  if(res&&res.error==="bad_key"){auth="need";setSync("off");render();return;}
  setSync("error");
  if(res&&res.message&&res.error!=="network")toast(res.message);
  else if(ops.length)toast("Can't reach your sheet. Changes will save when you're back online.");
  retryT=setTimeout(flush,15000);
}
function setSync(s){const el=$("#sync");if(!el)return;
  const t={connecting:"Connecting…",loading:"Refreshing…",saving:"Saving…",ok:"Synced "+new Date(lastSync).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}),error:"Offline · tap to retry",off:"Not connected"}[s];
  el.textContent=t;el.className="sync"+(s==="ok"?" on":s==="error"||s==="off"?" bad":"");el.dataset.state=s;}
document.addEventListener("visibilitychange",()=>{if(document.hidden||auth!=="ok")return;if(Date.now()-lastSync>15000)flush();});
setInterval(()=>{if(!document.hidden&&auth==="ok"&&!queue.length&&!inflight&&Date.now()-lastSync>60000)flush();},20000);
window.addEventListener("beforeunload",e=>{if(queue.length){e.preventDefault();e.returnValue="";}});

/* ---------- settings lists (hidden Settings tab) ---------- */
function setting(k){const r=S.settings.find(x=>eqi(x.key,k));return r?String(r.value||""):"";}
const splitList=v=>String(v||"").split(",").map(s=>s.trim()).filter(Boolean);
const STEPS=()=>{const l=splitList(setting("Steps"));return l.length?l:["Pick-up","Prep","Prime","Paint","Poly","Finish & list"];};
function stepDetail(name){const m={};String(setting("Step details")||"").split("|").forEach(p=>{const i=p.indexOf(":");if(i>0)m[p.slice(0,i).trim().toLowerCase()]=p.slice(i+1).trim();});
  const d=m[String(name).toLowerCase()];if(d)return d.charAt(0).toUpperCase()+d.slice(1);
  return{"pick-up":"Bringing it home","prep":"Clean, sand, tape, fill","prime":"Primer or pre-stain","paint":"Paint, stain, touch-up","poly":"Poly top-coat","finish & list":"Liners, beeswax, hardware, photos, listing"}[String(name).toLowerCase()]||"";}
const UNITS=()=>{const l=splitList(setting("Units"));return l.length?l:["each","sheet","pack","roll","can","bottle","qt","L","mL","oz"];};
const SUPCATS=()=>{const l=splitList(setting("Supply categories"));return l.length?l:["Strip & sand","Paint & finish","Hardware","Upholstery","Other"];};
/* Cost categories: how a project's supply costs are grouped, in refinishing-step order. Editable in the app (Costs → Edit categories); saved to Settings "Cost categories". */
const COSTCATS=()=>{const l=splitList(setting("Cost categories"));return l.length?l:["Cleaning & stripping","Sandpaper","Repairs","Primer","Paint","Stain","Poly & topcoat","Rollers & brushes","Hardware & liners","Upholstery","Other"];};
/* [what the supply name looks like, what a matching category name looks like]. Order matters: first match wins. */
const CAT_GUESS=[[/clean|strip|degreas|\btsp\b|krud|solvent|mineral spirit|vinegar|soap/,/clean|strip/],[/sand|abrasive|grit|steel wool|scuff/,/sand/],
  [/knob|pull|hinge|hardware|liner|glide|handle|brass|caster|rail guide/,/hardware|liner|knob/],[/foam|batting|fabric|vinyl|upholst|staple/,/uphol|fabric/],
  [/poly|varnish|lacquer|top ?coat|wax|urethane|sealer/,/poly|top|seal|varnish/],[/stain|danish|oil|dye|conditioner/,/stain|oil/],[/roller|brush|sponge|tray|tape|drop cloth|applicator|glove/,/roller|brush|applic|tool/],
  [/primer|prime|\bbin\b|kilz|shellac/,/prim/],[/paint|chalk|enamel|restore-a-finish|rub ?n ?buff/,/paint/],
  [/filler|putty|glue|epoxy|bondo|bracket|screw|nail|dowel|veneer|base|leg/,/repair|fill|glue/]];
/** Category for a supply name: one already picked for that supply, else a guess from the name, else the last category ("Other"). */
function guessCat(name,skipId){const cats=COSTCATS(),n=String(name||"").toLowerCase().trim();
  const exact=cats.find(c=>c.toLowerCase()===n);if(exact)return exact;
  const prev=S.supplyuse.filter(u=>u.id!==skipId&&u.category&&cats.includes(u.category)&&String(u.supply||"").toLowerCase().trim()===n).pop();if(prev)return prev.category;
  for(const g of CAT_GUESS)if(g[0].test(n)){const c=cats.find(x=>g[1].test(x.toLowerCase()));if(c)return c;}
  return cats.find(c=>/^other$/i.test(c))||cats[cats.length-1];}
const catOf=u=>u.category&&COSTCATS().includes(u.category)?u.category:guessCat(u.supply,u.id);
/** Change one Settings value (the tab is otherwise read-only to the app). */
function saveSetting(key,value){enqueue({op:"set",coll:"settings",id:key,data:{value}});}
const EXPCATS=()=>{const l=splitList(setting("Expense categories"));return l.length?l:["Pieces bought","Supplies","Hardware","Gas & fees","Other"];};

/* ---------- projects ---------- */
const same=(a,b)=>String(a==null?"":a).trim()===String(b==null?"":b).trim();
const pById=id=>S.projects.find(p=>p.id===id);
const pByNo=no=>S.projects.find(p=>same(p.no,no));
const noNum=no=>{const n=parseInt(no,10);return isNaN(n)?0:n+(/[a-z]/i.test(no)?.5:0);};
function nextNo(){let m=0;S.projects.forEach(p=>{const n=parseInt(p.no,10);if(!isNaN(n)&&n>m)m=n;});return m+1;}
const pTitle=p=>"#"+p.no+" "+p.name;
const usesOf=p=>S.supplyuse.filter(u=>same(u.project,p.no));
const costsOf=p=>r2(usesOf(p).reduce((s,u)=>s+(u.cost||0),0));
const timesOf=p=>S.timelog.filter(t=>same(t.project,p.no));
const hoursOf=p=>r2(timesOf(p).reduce((s,t)=>s+(t.hours||0),0));
const isOpen=p=>p.status==="Not started"||p.status==="In progress"||p.status==="Listed"||p.status==="Pending";
function calcProfit(p,sold,fee){return r2((+sold||0)+(+fee||0)-(p.paid||0)-costsOf(p));}
function profitOf(p){if(p.status==="Sold")return p.profit!=null?p.profit:calcProfit(p,p.sold,p.fee);if(p.status==="Disposed")return p.profit!=null?p.profit:-r2((p.paid||0)+costsOf(p));return null;}
function eventsOf(p){return S.listings.filter(l=>same(l.project,p.no)).map((l,i)=>Object.assign({_i:i},l)).sort((a,b)=>(a.date||"0").localeCompare(b.date||"0")||a._i-b._i);}
function listInfo(p){
  const ev=eventsOf(p);
  const listed=ev.filter(e=>/^(listed|relisted)$/i.test(e.event));
  const first=listed[0]||null;
  const priced=ev.filter(e=>e.price!=null&&!/^sold$/i.test(e.event));
  const now=priced.length?priced[priced.length-1].price:p.list;
  const firstPrice=first&&first.price!=null?first.price:(priced[0]?priced[0].price:p.list);
  const drops=ev.filter(e=>/drop/i.test(e.event)).length;
  const relists=ev.filter(e=>/^relisted$/i.test(e.event)).length;
  let views=null,saves=null,inq=null,checked=null;
  ev.forEach(e=>{if(e.views!=null)views=e.views;if(e.saves!=null)saves=e.saves;if(e.inquiries!=null)inq=e.inquiries;if(e.views!=null||e.saves!=null||e.inquiries!=null)checked=e.date;});
  const start=first&&first.date?first.date:null;
  const end=p.status==="Sold"&&p.soldOn?p.soldOn:today();
  const days=start?Math.max(0,daysBetween(start,end)):null;
  const platform=(listed.length?listed[listed.length-1].platform:"")||"";
  return{ev,first,now,firstPrice,drops,relists,views,saves,inq,checked,start,days,platform};
}
function ttsText(t){t=String(t||"").toLowerCase();const m=/([\d.]+)\s*(week|day|hour)/.exec(t);if(m){const n=+m[1];return m[2]==="week"?n*7:m[2]==="day"?n:n/24;}if(/half day/.test(t))return .5;return null;}
function daysToSell(p){const li=listInfo(p);if(p.status==="Sold"&&li.start)return li.days;return ttsText(p.tts);}
function needsHelp(p){const li=listInfo(p);return li.drops>0||li.relists>0||/relist|dropped/i.test(p.notes||"");}

/* step progress: a step is done once a later step has time logged, or the piece is listed or sold */
function stepState(p){
  const steps=STEPS(),t=timesOf(p);
  const by=steps.map(s=>t.filter(e=>eqi(e.step,s)));
  let last=-1;by.forEach((a,i)=>{if(a.length)last=i;});
  const finished=p.status==="Listed"||p.status==="Pending"||p.status==="Sold"||p.status==="Disposed";
  return steps.map((s,i)=>({name:s,entries:by[i],hours:r2(by[i].reduce((x,e)=>x+(e.hours||0),0)),
    state:finished?(by[i].length||i<=last?"done":"todo"):(i<last?"done":i===last?"cur":"todo")}));
}
function currentStepLabel(p){const st=stepState(p);const i=st.findIndex(s=>s.state==="cur");if(i<0)return"";return"Step "+i+" of "+(st.length-1)+" · "+st[i].name;}

/* ---------- goals ---------- */
const goalRow=(y,m)=>S.goals.find(g=>g.year===y&&g.month===m);
function soldIn(m){return S.projects.filter(p=>p.status==="Sold"&&monthKey(p.soldOn)===m);}
function monthProfit(m){return r2(soldIn(m).reduce((s,p)=>s+(profitOf(p)||0),0));}
function monthSales(m){return r2(soldIn(m).reduce((s,p)=>s+(p.sold||0),0));}

/* ---------- supplies: generic names for scanned and receipt items ---------- */
function genericName(t){
  const s=String(t||"").toLowerCase();
  const grit=s.match(/(\d{2,4})\s*(?:-?\s*grit|g\b)/)||s.match(/(?:sand ?paper|sanding\b[^\d]*)\D{0,12}\b(\d{2,4})\b(?!\s*(?:pk|pack|ct|sheets?|pc))/);
  if(/sand ?paper|sanding (sheet|disc|sponge|block)|abrasive|sanding/.test(s))return"Sandpaper"+(grit&&+grit[1]>=40&&+grit[1]<=3000?" "+grit[1]:"");
  if(/polycrylic|water[- ]?based.*(poly|finish)|(poly|finish).*water[- ]?based|\bwb\b.*poly|poly.*\bwb\b/.test(s))return"Water-based poly";
  if(/wipe[- ]?on poly/.test(s))return"Wipe-on poly";
  if(/spray/.test(s)&&/poly|lacquer|clear ?coat/.test(s))return"Spray poly";
  if(/polyurethane|\bpoly\b/.test(s))return"Oil poly";
  if(/danish oil/.test(s))return"Danish oil";
  if(/gel stain/.test(s))return"Gel stain";
  if(/pre-?stain|wood conditioner/.test(s))return"Pre-stain";
  if(/stain/.test(s))return"Stain";
  if(/stripper|citristrip|paint remover|strip/.test(s))return"Paint stripper";
  if(/primer|zinsser|kilz|\bbin\b|bulls ?eye/.test(s))return/spray|aerosol/.test(s)?"Spray primer":"Primer";
  if(/chalk/.test(s)&&/paint/.test(s))return"Chalk paint";
  if(/spray paint|krylon|aerosol/.test(s))return"Spray paint";
  if(/wood filler|putty|bondo|filler/.test(s))return"Wood filler";
  if(/painter'?s tape|masking tape|frog ?tape/.test(s))return"Painter's tape";
  if(/roller/.test(s))return"Rollers";
  if(/brush/.test(s))return"Brushes";
  if(/tack cloth/.test(s))return"Tack cloth";
  if(/mineral spirit|paint thinner/.test(s))return"Mineral spirits";
  if(/restor-?a-?finish/.test(s))return"Restore-A-Finish";
  if(/rub ?n ?buff/.test(s))return"Rub n Buff";
  if(/wax/.test(s))return"Furniture wax";
  if(/liner|contact paper|wallpaper/.test(s))return"Drawer liners";
  if(/glue|adhesive/.test(s))return"Wood glue";
  if(/knob|pull|handle|hinge|screw|bracket|glide/.test(s))return"Hardware";
  if(/tsp|degreas|cleaner|krud|simple green/.test(s))return"Cleaning products";
  if(/paint/.test(s))return"Paint";
  return String(t||"").replace(/\s+/g," ").trim().slice(0,40);
}
function supplyDefaults(name){
  const s=String(name).toLowerCase();
  const reusable=/sandpaper|brush|roller|tack cloth/.test(s);
  const category=/sandpaper|stripper|filler|tape|clean|tack|mineral/.test(s)?"Strip & sand":/hardware|liner|glue|knob|pull/.test(s)?"Hardware":/foam|batting|vinyl|fabric/.test(s)?"Upholstery":/paint|stain|poly|primer|oil|wax|finish|rub n|roller|brush/.test(s)?"Paint & finish":"Other";
  const unit=/sandpaper/.test(s)?"sheet":/spray/.test(s)?"can":/stripper|cleaning|mineral/.test(s)?"bottle":/tape/.test(s)?"roll":/paint|stain|poly|primer|oil/.test(s)?"qt":"each";
  return{reusable,category,unit};
}

/* ---------- pictures: kept private in Drive, cached on the phone ---------- */
const IMG=new Map();let idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise((res)=>{try{const r=indexedDB.open("ff-img",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});return idbP;}
async function idbGet(k){const db=await idb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction("img").objectStore("img").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function idbPut(k,v){const db=await idb();if(!db)return;try{db.transaction("img","readwrite").objectStore("img").put(v,k);}catch(e){}}
const loading=new Set();
async function loadImg(id){
  if(!id)return null;if(IMG.has(id))return IMG.get(id);
  let d=await idbGet(id);
  if(!d&&!loading.has(id)){loading.add(id);try{const r=await call("image",{id});d=r&&r.data;if(d)idbPut(id,d);}catch(e){}loading.delete(id);}
  if(d)IMG.set(id,d);return d||null;
}
function hydrateImages(root){(root||document).querySelectorAll("img[data-img]").forEach(async el=>{const id=el.dataset.img;if(el.dataset.done===id)return;const d=await loadImg(id);if(d&&el.dataset.img===id){el.src=d;el.dataset.done=id;el.hidden=false;}});}
function resizeImage(file,max,q){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,(max||1280)/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q||.8));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("That picture couldn't be opened."));};img.src=url;});}
function pickFiles(which){return new Promise(res=>{const el=$(which);el.value="";const done=()=>{el.removeEventListener("change",h);};const h=()=>{done();res([...el.files]);};el.addEventListener("change",h);el.click();});}
let PICN=0;const picName=base=>{const d=new Date();return base+" "+dayKey(Date.now())+" "+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+"-"+(++PICN);};
async function uploadPicture(file,kind,name){const data=await resizeImage(file,1280,.8);const r=await call("upload",{data,kind,name});IMG.set(r.id,data);idbPut(r.id,data);return r.id;}

function statusChip(p){
  if(p.status==="Sold")return'<span class="chip c-mint">Sold</span>';

/* ---------- projects list ---------- */
const PF={All:p=>true,Active:isOpen,Done:p=>p.status==="Sold",Disposed:p=>p.status==="Disposed"};
const SORTS=[["recent","Most recent"],["edited","Recently edited"],["high","Highest value"],["low","Lowest value"],["profit","Highest profit"],["number","Project number"]];
function sortProjects(a){
  const val=p=>p.status==="Sold"?(p.sold||0):(listInfo(p).now||p.list||p.paid||0);
  const s={recent:(x,y)=>noNum(y.no)-noNum(x.no),edited:(x,y)=>String(y.updated||"").localeCompare(String(x.updated||""))||noNum(y.no)-noNum(x.no),
    high:(x,y)=>val(y)-val(x),low:(x,y)=>val(x)-val(y),profit:(x,y)=>(profitOf(y)??-1e9)-(profitOf(x)??-1e9),number:(x,y)=>noNum(x.no)-noNum(y.no)}[VIEW.sort]||((x,y)=>noNum(y.no)-noNum(x.no));
  return a.slice().sort(s);
}
function projectCard(p){
  let meta="",right="";
  if(p.status==="Sold"){meta="Sold "+(p.soldOn?fmtShort(p.soldOn):"")+" · "+money0(p.sold);const pr=profitOf(p);right=`<span class="right ${pr<0?"neg":"pos"}">${pr<0?"":"+"}${money(pr)}</span>`;}
  else if(p.status==="Listed"||p.status==="Pending"){const li=listInfo(p);meta=(p.status==="Pending"?"Pending at ":"Listed at ")+money0(li.now)+(li.drops?" · "+li.drops+" drop"+(li.drops>1?"s":""):"")+(li.inq?" · "+li.inq+" inquiries":"");}
  else if(p.status==="In progress"){meta=(p.started?"Started "+fmtShort(p.started)+" · ":"")+hrs(hoursOf(p))+" so far";const st=stepState(p),i=st.findIndex(s=>s.state==="cur");right=`<span class="right">${i>0?Math.round(i/(st.length-1)*100)+"%":""}</span>`;}
  else if(p.status==="Disposed")meta="Disposed";
  else meta="Bought for "+money(p.paid||0);
  return`<button type="button" class="pcard" data-act="open" data-id="${p.id}">${thumbHTML(p)}<div class="pmeta"><span class="pname">#${esc(p.no)} ${esc(p.name)}</span><span class="small muted">${esc(meta)}</span><span>${statusChip(p)}</span></div>${right}</button>`;
}
function viewProjects(){

function timerHTML(p,step){return`<div class="timer"><div style="display:flex;flex-direction:column"><span class="t" data-timer>0:00:00</span><span class="s">${esc(step)} · timer running</span></div><button type="button" class="btn sm" data-act="stopTimer">Stop &amp; save</button></div>`;}

/* ---------- listings (market performance) ---------- */
const LPERIODS=[["all","All time"],["year","This year"],["90","Last 90 days"]];
function inPeriod(k){if(!k)return VIEW.lperiod==="all";if(VIEW.lperiod==="year")return k.slice(0,4)===today().slice(0,4);if(VIEW.lperiod==="90")return daysBetween(k,today())<=90;return true;}
function viewListings(){
  const sold=S.projects.filter(p=>p.status==="Sold"&&inPeriod(p.soldOn));
  const priced=sold.filter(p=>p.sold!=null&&p.list);
  const ratio=priced.length?priced.reduce((s,p)=>s+p.sold/p.list,0)/priced.length:null;
  const full=priced.filter(p=>p.sold>=p.list).length;
  const disc=priced.length?priced.reduce((s,p)=>s+Math.max(0,p.list-p.sold),0)/priced.length:null;
  const dts=sold.map(daysToSell).filter(d=>d!=null);
  const avgD=dts.length?dts.reduce((a,b)=>a+b,0)/dts.length:null;
  const helped=sold.filter(needsHelp);
  const listed=S.projects.filter(p=>p.status==="Listed"||p.status==="Pending").map(p=>({p,li:listInfo(p)})).sort((a,b)=>(b.li.days??-1)-(a.li.days??-1));
  const recent=sold.slice().sort((a,b)=>String(b.soldOn||"").localeCompare(String(a.soldOn||"")));
  const B=[["Under a day",d=>d<1],["1–7 days",d=>d>=1&&d<=7],["8–14 days",d=>d>7&&d<=14],["15–28 days",d=>d>14&&d<=28],["Over 4 weeks",d=>d>28]];
  const bc=B.map(b=>dts.filter(b[1]).length),bm=Math.max(1,...bc);
  const inq=S.projects.filter(p=>p.status==="Sold").map(p=>listInfo(p).inq).filter(x=>x!=null);
  return`<header class="top"><div class="grow"><h1>Listings</h1><div class="sub">How your pieces do on the market</div></div>${syncBtn}</header>
  <main>
    <div class="pills" role="group" aria-label="Period">${LPERIODS.map(l=>`<button type="button" class="pill ${VIEW.lperiod===l[0]?"on":""}" data-act="lperiod" data-v="${l[0]}" aria-pressed="${VIEW.lperiod===l[0]}">${l[1]}</button>`).join("")}</div>
    <div class="grid2">
      <div class="tile"><span class="l">Sold vs asking</span><span class="v">${pct(ratio)}</span><span class="s">average of ${priced.length} sale${priced.length===1?"":"s"}</span></div>
      <div class="tile"><span class="l">Full asking price</span><span class="v">${full} of ${priced.length}</span><span class="s">avg discount ${disc!=null?money0(disc):"–"}</span></div>
      <div class="tile"><span class="l">Time to sell</span><span class="v">${avgD!=null?Math.round(avgD)+" day"+(Math.round(avgD)===1?"":"s"):"–"}</span><span class="s">average${dts.length<sold.length?" ("+dts.length+" with dates)":""}</span></div>
      <div class="tile"><span class="l">Price drop or relist</span><span class="v">${helped.length} of ${sold.length}</span><span class="s">${inq.length?"avg "+Math.round(inq.reduce((a,b)=>a+b,0)/inq.length)+" inquiries per sale":"inquiries tracked from now on"}</span></div>
    </div>
    ${DESK?deskListed(listed):`    <section class="card" style="padding:10px 14px 4px">
      <div class="between" style="padding-bottom:4px"><h2>Listed now · ${listed.length}</h2><span class="small muted b">days · drops · inquiries</span></div>
      ${listed.map(({p,li})=>`<button type="button" class="lrow" data-act="open" data-id="${p.id}" data-sub="listing"><span class="grow" style="display:flex;flex-direction:column;min-width:0"><span class="b">#${esc(p.no)} ${esc(p.name)}</span><span class="small" style="color:${li.start?"var(--muted)":"var(--warm)"}">${li.now!=null?money0(li.now):""}${li.drops&&li.firstPrice!=null&&li.firstPrice!==li.now?" · down from "+money0(li.firstPrice):""}${li.start?"":" · add the date you listed it"}</span></span><span class="b small" style="white-space:nowrap">${li.days!=null?li.days+"d":"–"} · ${li.drops} · ${li.inq!=null?li.inq:"–"}</span>${I.chev}</button>`).join("")||'<p class="small muted" style="margin:4px 0 10px">Nothing listed right now.</p>'}
    </section>`}
    <section class="card" style="padding:10px 14px 4px">
      <div class="between" style="padding-bottom:4px"><h2>Sold</h2><span class="small muted b">sold of asking</span></div>
      ${(VIEW.soldAll?recent:recent.slice(0,6)).map(p=>`<button type="button" class="lrow" data-act="open" data-id="${p.id}" data-sub="listing"><span class="grow" style="display:flex;flex-direction:column;min-width:0"><span class="b">#${esc(p.no)} ${esc(p.name)}</span><span class="small muted">${p.soldOn?fmtShort(p.soldOn)+" · ":""}${money0(p.sold)}${p.list?" of "+money0(p.list):""}${daysToSell(p)!=null?" · "+(daysToSell(p)<1?"under a day":Math.round(daysToSell(p))+" days"):""}</span></span><span class="b small">${p.list&&p.sold!=null?pct(p.sold/p.list):""}</span>${I.chev}</button>`).join("")||'<p class="small muted" style="margin:4px 0 10px">No sales in this period.</p>'}
      ${recent.length>6?`<button type="button" class="link" style="margin-bottom:6px" data-act="soldAll">${VIEW.soldAll?"Show fewer":"Show all "+recent.length}</button>`:""}
    </section>
    ${dts.length?`<section class="card" style="display:flex;flex-direction:column;gap:8px"><h2>How fast pieces sold</h2><div class="hist">${B.map((b,i)=>`<span class="muted">${b[0]}</span><i style="width:${Math.round(bc[i]/bm*100)}%;${bc[i]?"":"background:var(--line)"}"></i><span style="text-align:right">${bc[i]}</span>`).join("")}</div></section>`:""}
    ${helped.length?`<section class="card" style="display:flex;flex-direction:column;gap:4px"><h2>Needed a price drop or relist</h2>${helped.map(p=>`<button type="button" class="lrow" data-act="open" data-id="${p.id}" data-sub="listing"><span class="grow b">#${esc(p.no)} ${esc(p.name)}</span>${I.chev}</button>`).join("")}</section>`:""}
  </main>`;
}

/* ---------- supplies ---------- */
function viewSupplies(){
  const q=VIEW.q.trim().toLowerCase();
  const list=S.supplies.filter(s=>!q||s.name.toLowerCase().includes(q)||String(s.category||"").toLowerCase().includes(q));
  const value=r2(S.supplies.reduce((t,s)=>t+(s.onHand||0)*(s.avgCost||0),0));
  const low=S.supplies.filter(isLow);
  const cats=[...new Set([...SUPCATS(),...list.map(s=>s.category||"Other")])].filter(c=>list.some(s=>(s.category||"Other")===c));
  const row=s=>{const top=Math.max((s.lowAt||0)*4,s.onHand||0,1),w=Math.round(Math.min(1,(s.onHand||0)/top)*100);
    return`<button type="button" class="lrow" style="flex-direction:column;align-items:stretch;gap:5px" data-act="supply" data-id="${s.id}">

  return`<header class="top"><div class="grow"><h1>Supplies</h1><div class="sub">${S.supplies.length} item${S.supplies.length===1?"":"s"} · ${money0(value)} on the shelf</div></div>${syncBtn}</header>

/* ---------- money ---------- */
const CATCOL={"Pieces bought":"#F27BA0","Supplies":"#3FB894","Hardware":"#7B6BD6","Gas & fees":"#F0A04B","Tax":"#5E8FD6","Other":"#8A8299"};
function viewMoney(){
  return`<header class="top"><div class="grow"><h1>Money</h1></div>${monthNav()}</header>
  <main>
    <div class="seg" role="group" aria-label="Money sections"><button type="button" class="${VIEW.money==="expenses"?"on":""}" data-act="money" data-v="expenses">Expenses</button><button type="button" class="${VIEW.money==="pnl"?"on":""}" data-act="money" data-v="pnl">Profit &amp; loss</button></div>
    ${VIEW.money==="pnl"?moneyPnl():moneyExpenses()}
  </main>
  ${VIEW.money==="expenses"?`<button type="button" class="fab fab2" data-act="newExpense" aria-label="Add an expense by hand">${I.plus}Add</button><button type="button" class="fab" data-act="receipt">${I.camera}Scan receipt</button>`:""}`;
}
function moneyExpenses(){
  const ex=S.expenses.filter(e=>monthKey(e.date)===VIEW.month).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  const total=r2(ex.reduce((s,e)=>s+(e.amount||0),0));
  const cats={};ex.forEach(e=>{const c=e.category||"Other";cats[c]=r2((cats[c]||0)+(e.amount||0));});
  const order=[...EXPCATS(),"Tax","Other"].filter((c,i,a)=>a.indexOf(c)===i&&cats[c]>0);Object.keys(cats).forEach(c=>{if(!order.includes(c)&&cats[c]>0)order.push(c);});
  const C=2*Math.PI*46;let off=0;
  const arcs=order.map(c=>{const L=total?cats[c]/total*C:0;const a=`<circle cx="60" cy="60" r="46" fill="none" stroke="${CATCOL[c]||"#8A8299"}" stroke-width="18" stroke-dasharray="${Math.max(0,L-(order.length>1?2:0)).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=L;return a;}).join("");
  return`<div class="row" style="gap:10px;background:var(--card);border:1px dashed var(--line2);border-radius:12px;padding:8px 12px;color:var(--muted)"><span class="small b">Kept separate from your audit expense sheet for now</span></div>
  <section class="card row" style="gap:14px">
    <div style="position:relative;width:132px;height:132px;flex-shrink:0"><svg width="132" height="132" viewBox="0 0 120 120" role="img" aria-label="Spending by category">${total?arcs:`<circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="18"/>`}</svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="b" style="font-size:20px">${money0(total)}</span><span class="small muted">spent</span></div></div>
    <div class="grow" style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700">${order.map(c=>`<div class="row" style="gap:8px"><span style="width:10px;height:10px;border-radius:3px;background:${CATCOL[c]||"#8A8299"};flex-shrink:0"></span><span class="grow">${esc(c)}</span><span>${money0(cats[c])}</span></div>`).join("")||'<span class="muted">Nothing logged this month.</span>'}</div>
  </section>
  ${DESK?deskExpenses(ex):`  <h2 class="h2" style="margin:4px 4px 0">This month</h2>
  <section class="card" style="padding:4px 14px">${ex.map(e=>`<button type="button" class="lrow" data-act="editExpense" data-id="${e.id}"><span class="grow" style="display:flex;flex-direction:column;min-width:0"><span class="b">${esc(e.item||e.store||"Expense")}</span><span class="small muted">${e.date?fmtShort(e.date)+" · ":""}${esc([e.store,e.category,e.project?"#"+e.project:""].filter(Boolean).join(" · "))}${e.receipt?" · receipt":""}</span></span><span class="b">${money(e.amount||0)}</span></button>`).join("")||'<p class="small muted">No expenses this month.</p>'}</section>`}
  <div style="height:70px"></div>`;
}
function moneyPnl(){
  const m=VIEW.month,y=+m.slice(0,4),mo=+m.slice(5,7),g=goalRow(y,mo);
  const prof=monthProfit(m),sales=monthSales(m),n=soldIn(m).length;
  const lastM=y<+today().slice(0,4)?12:y>+today().slice(0,4)?0:+today().slice(5,7);
  const rows=[];for(let i=1;i<=12;i++){const k=y+"-"+pad(i),gr=goalRow(y,i);rows.push({i,k,p:i<=lastM?monthProfit(k):null,g:gr&&gr.goal!=null?gr.goal:null,n:i<=lastM?soldIn(k).length:null});}
  const shown=rows.filter(r=>r.i<=Math.max(lastM,1));
  const maxV=Math.max(1,...shown.map(r=>Math.max(r.p||0,r.g||0)));const top=Math.ceil(maxV/500)*500;
  const dw=DESK?Math.max(480,Math.round((innerWidth-236-56-(innerWidth>1300?16:0))*(innerWidth>1300?2/3:1)-44)):0,W=DESK?dw:330,H=DESK?260:140,fs=DESK?12:10,x0=DESK?44:34,x1=W-2,y0=H-24,y1=DESK?16:10,bw=(x1-x0)/12,hb=DESK?Math.min(18,bw*.3):8;
  const yy=v=>y0-(v/top)*(y0-y1);
  const grid=[0,top/2,top].map(v=>`<line x1="${x0}" y1="${yy(v).toFixed(1)}" x2="${x1}" y2="${yy(v).toFixed(1)}" stroke="#352F42"/><text x="${x0-4}" y="${(yy(v)+3).toFixed(1)}" text-anchor="end" fill="#ABA3BC" font-size="${fs}" font-weight="700">${v>=1000?"$"+(v/1000)+"k":"$"+v}</text>`).join("");
  const bars=rows.map(r=>{const cx=x0+bw*(r.i-.5);let s="";if(r.p>0)s+=`<rect x="${(cx-hb).toFixed(1)}" y="${yy(r.p).toFixed(1)}" width="${(hb*2).toFixed(1)}" height="${(y0-yy(r.p)).toFixed(1)}" rx="3" fill="#F27BA0"><title>${MONTHS[r.i-1]}: ${money(r.p)}${r.g!=null?" of "+money0(r.g):""}</title></rect>`;
    if(r.g!=null)s+=`<line x1="${(cx-hb-3.5).toFixed(1)}" y1="${yy(r.g).toFixed(1)}" x2="${(cx+hb+3.5).toFixed(1)}" y2="${yy(r.g).toFixed(1)}" stroke="#EDE8F5" stroke-width="2" stroke-linecap="round"/>`;
    s+=`<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" fill="${r.i===mo?"#EDE8F5":"#ABA3BC"}" font-size="${fs}" font-weight="700">${MONTHS[r.i-1][0]}</text>`;return s;}).join("");
  const yP=r2(shown.reduce((s,r)=>s+(r.p||0),0)),yG=shown.reduce((s,r)=>s+(r.g||0),0),yN=shown.reduce((s,r)=>s+(r.n||0),0);
  const fullG=rows.reduce((s,r)=>s+(r.g||0),0);
  const yrRows=rows.map(r=>goalRow(y,r.i)).filter(Boolean);const pMin=yrRows.reduce((s,g)=>s+(g.min||0),0),pMax=yrRows.reduce((s,g)=>s+(g.max||0),0);
  const yS=S.projects.filter(p=>p.status==="Sold"&&p.soldOn&&p.soldOn.slice(0,4)===String(y)).reduce((s,p)=>s+(p.sold||0),0);
  const A=`<section class="card" style="display:flex;flex-direction:column;gap:6px">
    <div class="between"><span class="b small" style="font-size:13px">${esc(monthName(m))}</span><button type="button" class="btn sm ghost" style="height:30px;font-size:12px" data-act="goals">Edit goals</button></div>
    <div class="grid2"><div style="display:flex;flex-direction:column"><span class="small muted b">Sales</span><span class="b" style="font-size:22px">${money(sales)}</span></div><div style="display:flex;flex-direction:column"><span class="small muted b">Profit</span><span class="b" style="font-size:22px;color:var(--mint)">${money(prof)}</span></div></div>
    ${g&&g.goal?`<div class="track"><i style="width:${Math.max(0,Math.min(100,Math.round(prof/g.goal*100)))}%;background:var(--pink)"></i></div><span class="small muted b">${Math.round(prof/g.goal*100)}% of the ${money0(g.goal)} goal · ${n} of ${g.min!=null?g.min+(g.max!=null&&g.max!==g.min?"–"+g.max:""):"?"} pieces sold</span>`:`<span class="small muted">No goal set for this month.</span>`}
  </section>`;
  const B=`<section class="card" style="display:flex;flex-direction:column;gap:8px">
    <div class="between"><h2>Profit vs goal · ${y}</h2><div class="row small muted b" style="gap:12px"><span class="row" style="gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:var(--pink)"></span>Profit</span><span class="row" style="gap:5px"><span style="width:14px;height:2px;background:var(--ink)"></span>Goal</span></div></div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly profit against goal for ${y}" style="font-family:Nunito,sans-serif">${grid}${bars}</svg>
  </section>`;
  const C=`<section class="card" style="padding:10px 14px">
    <div class="tbl" style="grid-template-columns:1fr 78px 66px 46px"><span class="small muted b">Month</span><span class="small muted b r">Profit</span><span class="small muted b r">Goal</span><span class="small muted b r">Hit</span>
    ${shown.map(r=>{const hit=r.g?Math.round((r.p||0)/r.g*100)+"%":"–";const cur=r.i===mo;const st=cur?' style="color:var(--pink);font-weight:800"':(r.p?"":' style="color:var(--muted)"');return`<span${st}>${MONTHS[r.i-1]}</span><span class="r"${st}>${money(r.p||0)}</span><span class="r muted">${r.g!=null?money0(r.g):"–"}</span><span class="r"${st}>${hit}</span>`;}).join("")}</div>
    <div style="height:1px;background:var(--line);margin:8px 0"></div>
    <div class="tbl" style="grid-template-columns:1fr 78px 66px 46px;font-weight:800"><span>Year so far</span><span class="r pos">${money0(yP)}</span><span class="r muted">${money0(yG)}</span><span class="r">${yG?Math.round(yP/yG*100)+"%":"–"}</span></div>
    <p class="small muted" style="margin:6px 0 0">${yN} piece${yN===1?"":"s"} sold${pMax?" (forecast "+pMin+"–"+pMax+")":""} · ${money0(yS)} in sales${yS?" · "+pct(yP/yS)+" margin":""}${fullG?" · full-year goal "+money0(fullG):""}</p>
  </section>`;
  return DESK?`<div class="dk-pnl"><div class="dk-pnl-l">${A}${B}</div>${C}</div>`:A+B+C;
}

/* =====================================================================

const DESKQ=window.matchMedia("(min-width:1024px)");

DESKQ.addEventListener("change",e=>{DESK=e.matches;if(!DESK){D.edit=false;D.batch=null;}render();});
const D={edit:false,sel:{},drafts:{},batch:null,reading:""};
const NUMF=["paid","list","sold"];

/* Background syncs re-draw the screen. While typing in a desktop grid, wait until the cell loses focus. */
let heldRender=false;
function holdRender(){const a=document.activeElement;return!!(DESK&&a&&a.closest&&a.closest("[data-hold]")&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));}

/* edit mode */
const EDF=[["name","Name","text"],["status","Status","status"],["started","Started","date"],["paid","Paid","num"],["list","List price","num"],["sold","Sold price","num"],["soldOn","Sold on","date"],["notes","Notes","text"]];

const curVal=(p,f)=>D.drafts[p.id]&&f in D.drafts[p.id]?D.drafts[p.id][f]:origVal(p,f);
function setDraft(id,f,v){const p=pById(id);if(!p)return;const d=D.drafts[id]||(D.drafts[id]={});
  if(String(v)===origVal(p,f))delete d[f];else d[f]=v;if(!Object.keys(d).length)delete D.drafts[id];}

function saveBar(){

function saveDrafts(){

    Object.entries(ch).forEach(([f,v])=>{d[f]=NUMF.includes(f)?N(String(v).replace(/[$,\s]/g,"")):String(v).trim();});
    if(d.name==="")delete d.name;

    if(status==="Sold"&&!(d.soldOn||p.soldOn))d.soldOn=today();

    const np=pById(id);
    if(status==="Listed"&&!li.start)store.add("listings",{project:String(np.no),event:"Listed",date:today(),price:np.list??null,platform:PLATFORMS()[0]});
    else if("list"in d&&d.list!=null&&status==="Listed"&&d.list!==li.now)store.add("listings",{project:String(np.no),event:li.now!=null&&d.list<li.now?"Price drop":"Check-in",date:today(),price:d.list,platform:li.platform||""});
    if(d.status==="Sold"&&p.status!=="Sold"&&!li.ev.some(e=>/^sold$/i.test(e.event)))store.add("listings",{project:String(np.no),event:"Sold",date:np.soldOn||today(),price:np.sold,platform:li.platform||""});

}

function readAsData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Couldn't open "+f.name));r.readAsDataURL(f);});}
async function batchFiles(files){
  files=[...files].filter(f=>/^image\/|pdf$/.test(f.type));if(!files.length){toast("Drop photos or PDFs of receipts.");return;}
  for(let i=0;i<files.length;i++){const f=files[i];D.reading="Reading receipt "+(i+1)+" of "+files.length+"…";render();
    try{const data=/pdf$/.test(f.type)?await readAsData(f):await resizeImage(f,1800,.85);const r=await call("receipt",{data});
      const base={src:"Receipt",date:r.date||today(),store:r.store||"",receipt:r.receipt||""};
      const items=(r.items||[]).filter(it=>it.text||it.amount!=null);
      if(items.length)items.forEach(it=>D.batch.rows.push(brow(Object.assign({},base,{item:it.text||"",amount:it.amount??"",check:it.amount==null}))));
      else D.batch.rows.push(brow(Object.assign({},base,{item:f.name.replace(/\.[^.]+$/,""),amount:r.total??"",check:true})));
      if(r.tax)D.batch.rows.push(brow(Object.assign({},base,{item:"Tax",cat:"Tax",amount:r.tax})));
    }catch(e){D.batch.rows.push(brow({src:"Receipt",item:f.name,check:true}));toast((e.message||"Couldn't read")+" · "+f.name);}}
  D.batch.rows=D.batch.rows.filter(r=>r.src!=="Typed"||r.item||r.amount||r.store);if(!D.batch.rows.length)D.batch.rows.push(brow());
  D.reading="";render();
}
function pasteKey(s){s=String(s||"").trim();if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if(/^[\d.,$\s-]+$/.test(s)&&!/[\/-]\d/.test(s.replace(/^-/,"")))return null;
  let t=/\d{4}/.test(s)?Date.parse(s):Date.parse(s+" "+today().slice(0,4));if(isNaN(t)&&!/\d{4}/.test(s))t=Date.parse(s);
  return isNaN(t)?null:dayKey(t);}
function batchPaste(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());let n=0;
  lines.forEach(l=>{const cells=l.split("\t").map(c=>c.trim());let date=null,amount=null;const rest=[];
    cells.forEach((c,i)=>{if(date==null&&pasteKey(c)){date=pasteKey(c);return;}rest.push(c);});
    for(let i=rest.length-1;i>=0;i--){const v=N(rest[i].replace(/[$,\s]/g,""));if(v!=null){amount=v;rest.splice(i,1);break;}}
    const txt=rest.filter(Boolean);if(!txt.length&&amount==null)return;
    if(/^(date|item|description|amount)$/i.test(txt[0]||"")&&amount==null)return;
    D.batch.rows.push(brow({src:"Pasted",date:date||today(),item:txt[0]||"",store:txt[1]||"",amount:amount??""}));n++;});
  D.batch.rows=D.batch.rows.filter(r=>r.src!=="Typed"||r.item||r.amount||r.store);if(!D.batch.rows.length)D.batch.rows.push(brow());
  toast("Added "+n+" row"+(n===1?"":"s"));render();
}

  const open=S.projects.filter(isOpen),listed=open.filter(p=>p.status==="Listed");
  const dts=ytd.map(daysToSell).filter(d=>d!=null),avgD=dts.length?Math.round(dts.reduce((a,b)=>a+b,0)/dts.length):null;
  const gp=g&&g.goal?Math.max(0,Math.min(1,prof/g.goal)):null;
  /* 12-month chart with goal marks */
  const months=[];for(let i=1;i<=12;i++){const k=y+"-"+pad(i),gr=goalRow(y,i);months.push({k,i,v:k<=today().slice(0,7)?monthProfit(k):null,g:gr&&gr.goal!=null?gr.goal:null});}
  const mx=Math.max(1,...months.map(x=>Math.max(x.v||0,x.g||0)));
  const chart=`<div class="dh-chart" role="img" aria-label="Net profit by month in ${y}, with monthly goals">${months.map(x=>{const h=x.v>0?Math.max(4,Math.round(x.v/mx*170)):3,cur=x.k===m;
    return`<div class="dh-col"><span class="small ${cur?"b":"muted"}">${x.v?money0(x.v).replace(/,000$/,"k"):""}</span><div class="dh-bar-wrap">${x.g!=null?`<i class="dh-goal" style="bottom:${Math.round(x.g/mx*170)}px" title="Goal ${money0(x.g)}"></i>`:""}<div class="dh-bar" style="height:${h}px;background:${x.v==null?"var(--line)":cur?"var(--pink)":x.v>0?"var(--bar)":"var(--line2)"}"></div></div><span class="small ${cur?"b":"muted"}">${MONTHS[x.i-1].slice(0,3)}</span></div>`;}).join("")}</div>`;
  /* needs a look */
  const look=[];
  listed.forEach(p=>{const li=listInfo(p);
    if(!li.start)look.push({c:"warm",p,t:pTitle(p),s:"Listed, but the listing date is missing · add it"});
    else if(li.days>=21&&!li.inq)look.push({c:"warm",p,t:pTitle(p),s:"Listed "+li.days+" days, no inquiries · try a price drop"});
    else if(li.days>=7&&(!li.checked||daysBetween(li.checked,today())>=7))look.push({c:"blue",p,t:pTitle(p),s:"No check-in for a week · update views and inquiries"});});
  S.supplies.filter(isLow).forEach(s=>look.push({c:"warm",sup:s,t:s.name,s:r2(s.onHand||0)+" "+(s.unit||"")+" left · low at "+s.lowAt+" "+(s.unit||"")}));
  open.filter(p=>p.status==="Not started").forEach(p=>look.push({c:"blue",p,t:pTitle(p),s:"Bought"+(p.paid!=null?" for "+money0(p.paid):"")+", not started yet"}));
  const lookHTML=look.slice(0,6).map(x=>`<button type="button" class="dh-look" ${x.p?`data-act="dkOpenP" data-id="${x.p.id}"`:`data-act="supply" data-id="${x.sup.id}"`}><span class="dot" style="background:var(--${x.c})"></span><span class="grow" style="display:flex;flex-direction:column"><span class="b">${esc(x.t)}</span><span class="small muted">${esc(x.s)}</span></span>${I.chev||""}</button>`).join("")
    +(look.length>6?`<span class="small muted">and ${look.length-6} more</span>`:"");
  /* on the bench */
  const bench=open.filter(p=>p.status==="In progress").map(p=>{const st=stepState(p),i=st.findIndex(s=>s.state==="cur"),n=st.length-1;return{p,i,n,name:i>=0?st[i].name:"",pct:i>0?Math.round(i/n*100):0};}).sort((a,b)=>b.pct-a.pct);
  const benchHTML=bench.map(b=>`<button type="button" class="dh-bench" data-act="dkOpenP" data-id="${b.p.id}"><span class="b">${esc(pTitle(b.p))}</span><span class="small muted">${b.p.started?"Started "+fmtShort(b.p.started)+" · ":""}${hrs(hoursOf(b.p))} so far</span><span class="track"><i style="width:${b.pct}%"></i></span><span class="small b" style="color:var(--mint)">${b.i>0?esc(b.name)+" · step "+b.i+" of "+b.n:b.i===0?"Pick-up":"Not logged yet"}</span>${TIMER&&TIMER.pid===b.p.id?'<span class="chip c-mint" style="align-self:flex-start">Timer running</span>':""}</button>`).join("");
  return`<header class="top"><div class="grow"><h1>Shop snapshot</h1><div class="sub">${esc(monthName(m))}</div></div>${monthNav()}
    <button type="button" class="btn sm ghost" data-act="receipt">${I.camera}Add receipt</button><button type="button" class="btn sm" data-act="newProject">${I.plus}Add project</button>${syncBtn}</header>
  <main>
    <div class="dh-tiles">
      <section class="hero dh-hero" aria-label="Net profit this month"><span class="small b">Net profit · ${esc(MONTHS[mo-1])}</span><span class="big">${money(prof)}</span><span class="small">${soldN} piece${soldN===1?"":"s"} sold · ${money0(sales)} in sales</span>
        ${gp!=null?`<div class="meter" style="margin-top:8px"><i style="width:${Math.round(gp*100)}%"></i></div><span class="small b">${Math.round(prof/g.goal*100)}% of your ${money0(g.goal)} monthly goal</span>`:`<button type="button" class="link" style="color:var(--pink2);align-self:flex-start" data-act="goals">Set a goal for this month</button>`}</section>
      <div class="tile"><span class="l">Sold this month</span><span class="v">${soldN} piece${soldN===1?"":"s"}</span><span class="s">${g&&g.min!=null?"forecast "+g.min+(g.max!=null&&g.max!==g.min?"–"+g.max:""):"no forecast set"}</span></div>
      <div class="tile"><span class="l">Net profit ${y}</span><span class="v">${money0(ytdP)}</span><span class="s">January to ${esc(MONTHS[mo-1])}</span></div>
      <div class="tile"><span class="l">Profit margin</span><span class="v">${ytdS?pct(ytdP/ytdS):"–"}</span><span class="s">${y} so far</span></div>
      <div class="tile"><span class="l">Average days to sell</span><span class="v">${avgD!=null?avgD+" day"+(avgD===1?"":"s"):"–"}</span><span class="s">${y} so far</span></div>
    </div>
    <div class="dh-row">
      <section class="card dh-card dh-grow"><div class="between"><h2>Net profit by month, ${y}</h2>${months.some(x=>x.g!=null)?'<span class="small muted row" style="gap:6px"><i class="dh-key"></i>Goal</span>':`<button type="button" class="link" data-act="goals">Set goals</button>`}</div>${chart}</section>
      <section class="card dh-card dh-side"><h2>Needs a look</h2>${lookHTML||'<p class="small muted" style="margin:0">All clear. Nothing waiting on you.</p>'}</section>
    </div>
    <section class="card dh-card"><div class="between"><h2>On the bench · ${bench.length}</h2><button type="button" class="link" data-act="gotab" data-v="projects" data-f="Active">All projects</button></div>
      ${benchHTML?`<div class="dh-benches">${benchHTML}</div>`:'<p class="small muted" style="margin:0">Nothing in progress. Start a project from Projects.</p>'}</section>
  </main>`;
}

/* =====================================================================
   SHEETS (pop-up forms) and BACK BUTTON
   ===================================================================== */
let SH=null,skipPop=0,guard=false,guardT=null;
/* The phone's back button closes the top thing open (scanner, form, project) instead of leaving the app.
   One history entry stands in for "something is open"; it's added and removed as things open and close. */
function overlays(){return(document.getElementById("scanner")?1:0)+(document.getElementById("scrim")?1:0)+(VIEW.project?1:0);}
function syncGuard(){clearTimeout(guardT);guardT=setTimeout(()=>{const n=overlays();
  if(n&&!guard){history.pushState({ff:1},"");guard=true;}
  else if(!n&&guard){guard=false;skipPop++;history.back();}},0);}
const head=(t,sub)=>`<span class="grab" aria-hidden="true"></span><div class="between"><div style="display:flex;flex-direction:column;min-width:0"><h3>${esc(t)}</h3>${sub?`<span class="small muted">${esc(sub)}</span>`:""}</div><button type="button" class="x" data-act="closeSheet" aria-label="Close">${I.x}</button></div>`;
function openSheet(html,handlers,mount){
  let el=$("#scrim");
  if(!el){el=document.createElement("div");el.id="scrim";el.className="scrim";document.body.appendChild(el);
    el.addEventListener("click",e=>{if(e.target===el)closeSheet();});}
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  SH=handlers||{};const sh=el.querySelector(".sheet");if(mount)mount(sh);hydrateImages(sh);
  syncGuard();return sh;
}
function closeSheet(){const el=$("#scrim");if(!el)return;el.remove();SH=null;syncGuard();}
function openProject(id,sub){VIEW.project=id;VIEW.sub=sub||"steps";if(!DESK)window.scrollTo(0,0);else{const sd=document.querySelector(".dk-side");if(sd)sd.scrollTop=0;}render();syncGuard();}
function closeProject(){VIEW.project=null;render();syncGuard();}
window.addEventListener("popstate",()=>{
  if(skipPop>0){skipPop--;return;}
  guard=false;
  if($("#scanner"))closeScanner(true);
  else if($("#scrim")){$("#scrim").remove();SH=null;}
  else if(VIEW.project){VIEW.project=null;render();}
  syncGuard();
});
const val=(sh,sel)=>{const el=sh.querySelector(sel);return el?el.value.trim():"";};
const numv=(sh,sel)=>{const v=val(sh,sel).replace(/[$,\s]/g,"");return v===""||isNaN(+v)?null:+v;};
const projOptions=(sel,onlyOpen)=>S.projects.filter(p=>!onlyOpen||isOpen(p)||same(p.no,sel)).slice().sort((a,b)=>noNum(b.no)-noNum(a.no)).map(p=>opt(p.no,sel,"#"+p.no+" "+p.name)).join("");

function tickTimers(){if(!TIMER)return;const s=Math.floor((Date.now()-TIMER.start)/1000);const t=Math.floor(s/3600)+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);document.querySelectorAll("[data-timer]").forEach(el=>{el.textContent=t;});}
setInterval(tickTimers,1000);

/* ---------- listing events and selling ---------- */
function sheetListEvent(p,type,ev){
  const li=listInfo(p),e=ev||{event:type,date:p.status==="Sold"&&p.soldOn?p.soldOn:today(),price:type==="Check-in"?null:li.now,platform:li.platform||PLATFORMS()[0]};
  const kind=e.event,priced=/^(listed|relisted|price drop|sold)$/i.test(kind),check=/check/i.test(kind);
  const title=ev?"Edit listing entry":{"Listed":"Start listing","Relisted":"Relist","Price drop":"Drop the price","Check-in":"Update interest numbers"}[kind]||kind;
  openSheet(`${head(title,pTitle(p))}
    <div class="grid2"><label class="f">Date<input class="input" type="date" id="lDate" value="${esc(e.date||"")}"></label>${priced?`<label class="f">${/drop/i.test(kind)?"New price":"Price"}<input class="input" id="lPrice" inputmode="decimal" value="${e.price??""}"></label>`:""}</div>
    ${/^(listed|relisted)$/i.test(kind)?`<label class="f">Where<select class="input" id="lPlat">${PLATFORMS().map(x=>opt(x,e.platform)).join("")}</select></label>`:""}
    ${check?`<p class="small muted" style="margin:0">Copy these from the listing's insights. Leave any you don't have blank.</p><div class="grid3"><label class="f">Views<input class="input" id="lViews" inputmode="numeric" value="${(ev?e.views:li.views)??""}"></label><label class="f">Saves<input class="input" id="lSaves" inputmode="numeric" value="${(ev?e.saves:li.saves)??""}"></label><label class="f">Inquiries<input class="input" id="lInq" inputmode="numeric" value="${(ev?e.inquiries:li.inq)??""}"></label></div>`:""}
    <label class="f">Notes<input class="input" id="lNotes" value="${esc(e.notes||"")}" placeholder="Optional, e.g. new photos and staging"></label>
    <div class="row" style="gap:10px">${ev?`<button type="button" class="btn danger" data-act="sh:del">Delete</button>`:""}<button type="button" class="btn" style="flex:1" data-act="sh:save">Save</button></div>`,{
    save(sh){const d={project:String(p.no),event:kind,date:val(sh,"#lDate"),notes:val(sh,"#lNotes")};
      if(priced){d.price=numv(sh,"#lPrice");if(d.price==null&&!/sold/i.test(kind)){toast("Enter the price.");return;}}
      if(sh.querySelector("#lPlat"))d.platform=val(sh,"#lPlat");
      if(check){d.views=numv(sh,"#lViews");d.saves=numv(sh,"#lSaves");d.inquiries=numv(sh,"#lInq");}
      if(ev)store.update("listings",ev.id,d);else store.add("listings",d);
      if(priced&&!/sold/i.test(kind)){if(p.status!=="Sold")store.update("projects",p.id,{list:d.price,status:"Listed"});else syncAsking(p);}
      closeSheet();},
    del(){store.del("listings",ev.id);if(p.status==="Sold")syncAsking(p);closeSheet();}});
